%YAML 1.1
# ROS distribution file
# see REP 143: http://ros.org/reps/rep-0143.html
---
release_platforms:
  rhel:
  - '9'
  ubuntu:
  - resolute
repositories:
  ament_cmake:
    release:
      packages:
      - ament_cmake_core
      tags:
        release: release/rolling/{package}/{version}
      url: https://github.com/ros2-gbp/ament_cmake-release.git
      version: 2.9.0-1
    source:
      type: git
      url: https://github.com/ament/ament_cmake.git
      version: rolling
    status: developed
  ament_package:
    release:
      tags:
        release: release/rolling/{package}/{version}
      url: https://github.com/ros2-gbp/ament_package-release.git
      version: 0.19.0-1
    source:
      type: git
      url: https://github.com/ament/ament_package.git
      version: rolling
    status: developed
  demo_cargo_pkgs:
    release:
      packages:
      - demo_cargo_pkg_app
      - demo_cargo_pkg_lib
      tags:
        release: release/cargotest/{package}/{version}
      url: https://github.com/cottsay/demo_cargo_pkgs-release.git
      version: 0.1.0-1
    source:
      type: git
      url: https://github.com/cottsay/demo_cargo_pkgs.git
      version: main
    status: maintained
  ros_workspace:
    release:
      tags:
        release: release/rolling/{package}/{version}
      url: https://github.com/ros2-gbp/ros_workspace-release.git
      version: 1.0.3-8
    source:
      type: git
      url: https://github.com/ros2/ros_workspace.git
      version: latest
    status: maintained
type: distribution
version: 2
